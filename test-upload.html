<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitrix24 File Upload Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #2E7D32;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2E7D32;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #2E7D32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1B5E20;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        
        .file-preview.show {
            display: block;
        }
        
        .file-preview img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .logs {
            margin-top: 30px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 4px;
            padding: 4px 0;
        }
        
        .log-success { color: #4CAF50; }
        .log-error { color: #f44336; }
        .log-warning { color: #ff9800; }
        .log-info { color: #2196F3; }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }
        
        .clear-logs {
            margin-top: 10px;
            padding: 8px 16px;
            background: #666;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Bitrix24 Upload Tester</h1>
        <p class="subtitle">Test file attachment to tasks via webhook</p>
        
        <form id="testForm">
            <div class="form-group">
                <label for="webhookUrl">Webhook URL *</label>
                <input 
                    type="url" 
                    id="webhookUrl" 
                    placeholder="https://your-portal.bitrix24.com/rest/1/TOKEN/"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="taskId">Task ID (optional - will create if empty)</label>
                <input 
                    type="text" 
                    id="taskId" 
                    placeholder="123"
                >
            </div>
            
            <div class="form-group">
                <label for="file">Select Image *</label>
                <input 
                    type="file" 
                    id="file" 
                    accept="image/*"
                    required
                >
                <div id="filePreview" class="file-preview"></div>
            </div>
            
            <div class="form-group">
                <label for="method">Upload Method</label>
                <select id="method">
                    <option value="auto">Auto (Try both)</option>
                    <option value="method1">Method 1: task.commentitem.add</option>
                    <option value="method2">Method 2: disk.folder.uploadfile</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">
                🚀 Test Upload
            </button>
        </form>
        
        <div id="status" class="status"></div>
        
        <div class="logs" id="logs">
            <div class="log-entry log-info">📋 Console logs will appear here...</div>
        </div>
        <button class="clear-logs" onclick="clearLogs()">Clear Logs</button>
    </div>

    <script>
        let logs = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ message, type, timestamp });
            
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            
            console.log(message);
        }
        
        function clearLogs() {
            logs = [];
            document.getElementById('logs').innerHTML = '<div class="log-entry log-info">📋 Logs cleared</div>';
        }
        
        function showStatus(message, isSuccess) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${isSuccess ? 'success' : 'error'}`;
        }
        
        // File preview
        document.getElementById('file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const preview = document.getElementById('filePreview');
                preview.innerHTML = `
                    <strong>File:</strong> ${file.name}<br>
                    <strong>Size:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
                    <strong>Type:</strong> ${file.type}
                    <img src="${URL.createObjectURL(file)}" alt="Preview">
                `;
                preview.classList.add('show');
                log(`📄 File selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`, 'info');
            }
        });
        
        // File to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        // Create test task
        async function createTestTask(webhookUrl) {
            log('📝 Creating test task...', 'info');
            
            const response = await fetch(`${webhookUrl}/tasks.task.add.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: {
                        TITLE: 'Test Upload Task',
                        DESCRIPTION: 'Auto-created for upload testing',
                        RESPONSIBLE_ID: 1
                    }
                })
            });
            
            const result = await response.json();
            
            if (result.error) {
                throw new Error(result.error.error_description || result.error.error);
            }
            
            const taskId = result.result.task.id;
            log(`✅ Task created: ID ${taskId}`, 'success');
            return taskId;
        }
        
        // Method 1: Direct attachment
        async function uploadMethod1(webhookUrl, taskId, file, base64Content) {
            log('🚀 Method 1: task.commentitem.add with FILES', 'info');
            
            const params = new URLSearchParams();
            params.append('TASKID', taskId);
            params.append('FIELDS[POST_MESSAGE]', 'Photo attachment (test)');
            params.append('FIELDS[FILES][0][name]', file.name);
            params.append('FIELDS[FILES][0][content]', base64Content);
            
            const response = await fetch(`${webhookUrl}/task.commentitem.add.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            
            log(`📊 Response status: ${response.status}`, response.ok ? 'success' : 'error');
            
            const result = await response.json();
            log(`📥 Result: ${JSON.stringify(result)}`, result.error ? 'error' : 'success');
            
            if (result.error) {
                throw new Error(`Method 1 failed: ${result.error.error_description || result.error.error}`);
            }
            
            if (!result.result) {
                throw new Error('Method 1: Unexpected response format');
            }
            
            return true;
        }
        
        // Method 2: Upload then attach
        async function uploadMethod2(webhookUrl, taskId, file, base64Content) {
            log('🚀 Method 2: disk.folder.uploadfile + attach', 'info');
            
            // Step 1: Upload to disk
            const uploadParams = new URLSearchParams();
            uploadParams.append('id', 'upload');
            uploadParams.append('data[NAME]', file.name);
            uploadParams.append('fileContent[0]', base64Content);
            
            const uploadResponse = await fetch(`${webhookUrl}/disk.folder.uploadfile.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: uploadParams.toString()
            });
            
            log(`📊 Upload response status: ${uploadResponse.status}`, uploadResponse.ok ? 'success' : 'error');
            
            const uploadResult = await uploadResponse.json();
            
            if (uploadResult.error || !uploadResult.result?.ID) {
                throw new Error(`Method 2 upload failed: ${uploadResult.error?.error_description || 'No file ID'}`);
            }
            
            const fileId = uploadResult.result.ID;
            log(`✅ File uploaded to disk: ID ${fileId}`, 'success');
            
            // Step 2: Attach to task
            const attachParams = new URLSearchParams();
            attachParams.append('TASKID', taskId);
            attachParams.append('FIELDS[POST_MESSAGE]', 'Photo attachment (test - method 2)');
            attachParams.append('FIELDS[UF_FORUM_MESSAGE_DOC][0]', `n${fileId}`);
            
            const attachResponse = await fetch(`${webhookUrl}/task.commentitem.add.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: attachParams.toString()
            });
            
            const attachResult = await attachResponse.json();
            log(`📥 Attach result: ${JSON.stringify(attachResult)}`, attachResult.error ? 'error' : 'success');
            
            if (attachResult.error || !attachResult.result) {
                throw new Error(`Method 2 attach failed: ${attachResult.error?.error_description || 'Unknown error'}`);
            }
            
            return true;
        }
        
        // Form submission
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Testing...';
            
            clearLogs();
            log('🧪 Starting upload test...', 'info');
            
            try {
                const webhookUrl = document.getElementById('webhookUrl').value.replace(/\/$/, '');
                let taskId = document.getElementById('taskId').value.trim();
                const file = document.getElementById('file').files[0];
                const method = document.getElementById('method').value;
                
                // Validate
                if (!file) {
                    throw new Error('Please select a file');
                }
                
                if (file.size > 10 * 1024 * 1024) {
                    throw new Error(`File too large: ${(file.size / 1024 / 1024).toFixed(2)} MB (max 10MB)`);
                }
                
                // Create task if needed
                if (!taskId) {
                    taskId = await createTestTask(webhookUrl);
                }
                
                // Convert to base64
                log('🔄 Converting file to base64...', 'info');
                const base64Content = await fileToBase64(file);
                log(`✅ Base64 length: ${base64Content.length} characters`, 'success');
                
                // Try upload methods
                let success = false;
                
                if (method === 'auto' || method === 'method1') {
                    try {
                        await uploadMethod1(webhookUrl, taskId, file, base64Content);
                        log('✅ Method 1 succeeded!', 'success');
                        success = true;
                    } catch (error) {
                        log(`⚠️ Method 1 failed: ${error.message}`, 'warning');
                        if (method !== 'auto') throw error;
                    }
                }
                
                if (!success && (method === 'auto' || method === 'method2')) {
                    try {
                        await uploadMethod2(webhookUrl, taskId, file, base64Content);
                        log('✅ Method 2 succeeded!', 'success');
                        success = true;
                    } catch (error) {
                        log(`❌ Method 2 failed: ${error.message}`, 'error');
                        throw error;
                    }
                }
                
                if (success) {
                    showStatus(`✅ File uploaded successfully! Check task ${taskId} in Bitrix24`, true);
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                showStatus(`❌ Upload failed: ${error.message}`, false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Test Upload';
            }
        });
        
        log('✅ Tester loaded and ready', 'success');
    </script>
</body>
</html>
