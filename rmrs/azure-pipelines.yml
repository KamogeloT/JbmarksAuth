trigger:
  branches:
    include:
      - master
      - feature/rmrs
  paths:
    include:
      - rmrs/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  nodeVersion: '20.x'
  azureSubscription: 'Azure subscription 1'
  appServiceName: 'jbmarks-rmrs'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Build RMRS'
        steps:
          # .NET SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          # Node.js for Angular
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          # Restore .NET
          - script: dotnet restore
            displayName: 'Restore .NET packages'
            workingDirectory: 'rmrs/src'

          # Build .NET
          - script: dotnet build --configuration $(buildConfiguration) --no-restore
            displayName: 'Build .NET'
            workingDirectory: 'rmrs/src'

          # Publish .NET
          - script: dotnet publish Rmrs.Api -c $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory)/api
            displayName: 'Publish .NET API'
            workingDirectory: 'rmrs/src'

          # Install Angular dependencies
          - script: npm ci
            displayName: 'Install Angular packages'
            workingDirectory: 'rmrs/client'

          # Build Angular
          - script: npx ng build --configuration=production
            displayName: 'Build Angular'
            workingDirectory: 'rmrs/client'

          # Copy Angular output to API wwwroot
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/api/wwwroot
              cp -r rmrs/client/dist/rmrs-client/browser/* $(Build.ArtifactStagingDirectory)/api/wwwroot/ 2>/dev/null || cp -r rmrs/client/dist/rmrs-client/* $(Build.ArtifactStagingDirectory)/api/wwwroot/
            displayName: 'Copy Angular to wwwroot'

          # Zip for deployment
          - task: ArchiveFiles@2
            displayName: 'Zip deployment package'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/rmrs.zip'

          # Publish artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/rmrs.zip'
              ArtifactName: 'rmrs-deploy'

  - stage: Deploy
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Azure App Service'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to jbmarks-rmrs'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(appServiceName)'
                    package: '$(Pipeline.Workspace)/rmrs-deploy/rmrs.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
