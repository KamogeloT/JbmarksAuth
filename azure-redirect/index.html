<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBmarks OAuth Redirect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting to JBmarks app...</p>
    </div>
    <script>
        (function() {
            // Prevent double processing (as per OAuth best practices)
            const PROCESSED_KEY = 'jbmarks_oauth_processed';
            if (sessionStorage.getItem(PROCESSED_KEY)) {
                console.log('OAuth callback already processed, ignoring duplicate');
                return;
            }
            sessionStorage.setItem(PROCESSED_KEY, 'true');
            
            // Get ALL URL parameters from Bitrix24 (preserve everything)
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');
            const errorDescription = urlParams.get('error_description');
            const domain = urlParams.get('domain');
            const state = urlParams.get('state');
            const memberId = urlParams.get('member_id');
            const scope = urlParams.get('scope');
            
            // Build redirect URL for Android deep link with all parameters
            let redirectUrl;
            if (code) {
                // Success: redirect with authorization code and all parameters
                const params = new URLSearchParams();
                params.append('code', code);
                if (domain) params.append('domain', domain);
                if (state) params.append('state', state);
                if (memberId) params.append('member_id', memberId);
                if (scope) params.append('scope', scope);
                redirectUrl = `jbmarks://oauth_redirect?${params.toString()}`;
            } else if (error) {
                // Error: redirect with error information
                const params = new URLSearchParams({ error });
                if (errorDescription) {
                    params.append('error_description', errorDescription);
                }
                redirectUrl = `jbmarks://oauth_redirect?${params.toString()}`;
            } else {
                // No code or error - redirect anyway with error
                redirectUrl = 'jbmarks://oauth_redirect?error=no_code_received';
            }
            
            // Multiple redirect methods to ensure it works
            // Method 1: Immediate redirect (primary)
            window.location.href = redirectUrl;
            
            // Method 2: Try window.location.replace (more aggressive)
            setTimeout(function() {
                try {
                    window.location.replace(redirectUrl);
                } catch (e) {
                    console.error('Redirect failed:', e);
                }
            }, 100);
            
            // Method 3: Fallback - show manual link after 1.5 seconds
            setTimeout(function() {
                const container = document.querySelector('.container');
                if (container) {
                    container.innerHTML = `
                        <h2>Redirecting to JBmarks app...</h2>
                        <p>If the app doesn't open automatically, click below:</p>
                        <p style="margin-top: 20px;">
                            <a href="${redirectUrl}" style="display: inline-block; padding: 12px 24px; background-color: #1B5E20; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">
                                Open JBmarks App
                            </a>
                        </p>
                        <p style="margin-top: 20px; font-size: 12px; color: #666;">
                            Make sure the JBmarks app is installed on your device.
                        </p>
                    `;
                }
            }, 1500);
        })();
    </script>
</body>
</html>
