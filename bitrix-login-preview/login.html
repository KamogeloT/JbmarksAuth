<!DOCTYPE html>
<html lang="en">
<head>
    <title>JBmarks - Sign In</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            background-image: url('LOGO.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* === CARD === */
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.06);
        }
        @media (max-width: 440px) {
            .login-card { padding: 36px 24px 28px; }
        }

        /* === BRAND === */
        .brand { text-align: center; margin-bottom: 12px; }
        .brand img {
            width: 80px; height: 80px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        /* === FORM === */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            height: 52px;
            padding: 0 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            color: #1a1a1a;
            background: #f4f4f5;
            outline: none;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            background: #eef7ee;
            box-shadow: 0 0 0 2px #1B5E20;
        }

        .remember-row {
            display: flex;
            align-items: center;
            margin: 8px 0 20px;
        }
        .remember-row input[type="checkbox"] {
            width: 18px; height: 18px; margin-right: 8px;
            accent-color: #1B5E20;
        }
        .remember-row label {
            font-size: 13px; color: #888; cursor: pointer;
        }

        .btn-login {
            width: 100%;
            height: 52px;
            padding: 0;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(27,94,32,0.25);
            letter-spacing: 0.3px;
        }
        .btn-login:hover {
            box-shadow: 0 6px 20px rgba(27,94,32,0.35);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }

        .form-links {
            text-align: center;
            margin-top: 18px;
        }
        .form-links a {
            color: #1B5E20;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .form-links a:hover { text-decoration: underline; }

        /* === FOOTER === */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 11px;
            color: #bbb;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand"></div>

    <form>
        <div class="form-group">
            <label>Login</label>
            <input type="text" name="USER_LOGIN" placeholder="Enter your login">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="USER_PASSWORD" placeholder="Enter your password">
        </div>

        <div class="remember-row">
            <input type="checkbox" id="remember" name="USER_REMEMBER" value="Y">
            <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn-login">Sign In</button>

        <div class="form-links">
            <a href="#">Forgot password?</a>
        </div>
    </form>

    <div class="login-footer">Powered by SDiMotion</div>
</div>
</body>
</html>
